<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; background: #eaf6ff;
           font-family: sans-serif; }
    svg { width: 260px; height: auto; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pink flower">
    <!-- stem -->
    <path d="M100 150 C100 200 95 250 100 295" stroke="#3a8a3a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M99 230 C70 215 55 225 50 240 C70 250 90 245 99 230Z" fill="#4caf50"/>
    <path d="M100 205 C130 190 148 198 152 214 C130 224 108 220 100 205Z" fill="#4caf50"/>
    <!-- petals -->
    <g transform="translate(100 100)" fill="#ff7eb6" stroke="#e0508f" stroke-width="1.5">
      <ellipse cx="0" cy="-38" rx="20" ry="36"/>
      <ellipse cx="0" cy="-38" rx="20" ry="36" transform="rotate(45)"/>
      <ellipse cx="0" cy="-38" rx="20" ry="36" transform="rotate(90)"/>
      <ellipse cx="0" cy="-38" rx="20" ry="36" transform="rotate(135)"/>
      <ellipse cx="0" cy="-38" rx="20" ry="36" transform="rotate(180)"/>
      <ellipse cx="0" cy="-38" rx="20" ry="36" transform="rotate(225)"/>
      <ellipse cx="0" cy="-38" rx="20" ry="36" transform="rotate(270)"/>
      <ellipse cx="0" cy="-38" rx="20" ry="36" transform="rotate(315)"/>
    </g>
    <!-- center -->
    <circle cx="100" cy="100" r="22" fill="#ffd54a" stroke="#e0a800" stroke-width="2"/>
  </svg>
</body>
</html>
